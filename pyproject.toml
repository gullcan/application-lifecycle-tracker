[project]
name = "application-tracker"
version = "0.1.0"
description = "Track job applications, lifecycle transitions, and follow-up schedules."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/application_tracker"]
