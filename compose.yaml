services:
  api:
    build:
      context: .
    image: application-lifecycle-tracker:local
    ports:
      - "8000:8000"
    environment:
      APPLICATION_TRACKER_DATABASE_PATH: /data/application_tracker.db
    volumes:
      - application-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  application-data: